<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alessandro Gillies — Game</title>

  <!-- Set theme before paint; theme-init.js also creates the favicon link -->
  <script src="/theme-init.js"></script>

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A small interactive skill game by Alessandro Gillies.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">

  <!-- Easter egg page: keep search engines from indexing it. -->
  <meta name="robots" content="noindex">

  <link rel="canonical" href="https://alessandrogillies.com/game/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Alessandro Gillies — Game">
  <meta property="og:description" content="A small interactive skill game by Alessandro Gillies.">
  <meta property="og:url" content="https://alessandrogillies.com/game/">
  <meta property="og:image" content="https://alessandrogillies.com/social-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_GB">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Alessandro Gillies — Game">
  <meta name="twitter:description" content="A small interactive skill game by Alessandro Gillies.">
  <meta name="twitter:image" content="https://alessandrogillies.com/social-card.jpg">

  <!-- Site CSS -->
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/game.css">
</head>
<body data-page="game">

  <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch to dark mode"><span class="theme-toggle__icon" aria-hidden="true">☀️</span></button>

  <main class="wrap">
    <div class="page-header">
      <img src="/profile-image.jpg" alt="Ale" class="profile-image" width="140" height="140" decoding="async" fetchpriority="high">
      <h1>game</h1>
    </div>

    <section class="camp-world" aria-label="camp world">
      <div class="camp-scene" id="campScene" data-wood-stage="0" aria-hidden="true">
        <svg class="camp-illustration" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid slice" focusable="false">
          <rect class="camp-sky" width="1200" height="760"></rect>
          <circle class="camp-sun" cx="930" cy="125" r="52"></circle>
          <polygon class="camp-mountain camp-mountain--far" points="0,350 190,170 360,330 505,145 735,350"></polygon>
          <polygon class="camp-mountain camp-mountain--near" points="420,390 650,175 845,360 1015,205 1200,375 1200,760 420,760"></polygon>
          <path class="camp-ground" d="M0 405 Q180 350 360 405 T720 400 T1200 410 V760 H0 Z"></path>
          <path class="camp-path" d="M630 760 Q660 640 750 555 Q820 490 900 445 Q810 560 850 760 Z"></path>

          <g class="camp-tree camp-tree--left" transform="translate(75 270)">
            <polygon class="camp-tree__crown" points="42,0 0,88 24,88 5,139 79,139 58,88 84,88"></polygon>
            <rect class="camp-tree__trunk" x="35" y="130" width="14" height="76"></rect>
          </g>
          <g class="camp-tree camp-tree--right" transform="translate(1030 245) scale(1.2)">
            <polygon class="camp-tree__crown" points="42,0 0,88 24,88 5,139 79,139 58,88 84,88"></polygon>
            <rect class="camp-tree__trunk" x="35" y="130" width="14" height="76"></rect>
          </g>

          <g class="camp-fire" transform="translate(505 505)">
            <polygon class="camp-fire__stone" points="0,52 18,38 42,42 54,61 37,76 12,71"></polygon>
            <polygon class="camp-fire__stone" points="52,60 70,43 95,46 108,64 91,78 65,75"></polygon>
            <path class="camp-fire__flame" d="M53 60 C26 38 49 19 66 0 C64 27 91 28 85 52 C82 67 66 74 53 60 Z"></path>
          </g>

          <g class="camp-stage camp-stage--lean-to">
            <polygon class="camp-structure__shadow" points="650,579 837,579 895,598 696,598"></polygon>
            <polygon class="camp-structure__back" points="648,477 758,374 758,570 648,570"></polygon>
            <polygon class="camp-structure__roof" points="620,477 758,340 895,477"></polygon>
            <line class="camp-structure__beam" x1="648" y1="477" x2="758" y2="374"></line>
            <line class="camp-structure__beam" x1="758" y1="374" x2="895" y2="477"></line>
            <line class="camp-structure__beam" x1="758" y1="374" x2="758" y2="570"></line>
          </g>

          <g class="camp-stage camp-stage--hut">
            <polygon class="camp-structure__shadow" points="590,588 905,588 966,607 648,607"></polygon>
            <rect class="camp-structure__wall" x="610" y="410" width="300" height="180"></rect>
            <polygon class="camp-structure__roof" points="575,415 760,275 945,415"></polygon>
            <rect class="camp-structure__door" x="735" y="475" width="62" height="115"></rect>
            <rect class="camp-structure__window" x="650" y="455" width="48" height="48"></rect>
            <rect class="camp-structure__window" x="822" y="455" width="48" height="48"></rect>
            <line class="camp-structure__beam" x1="610" y1="410" x2="910" y2="410"></line>
          </g>

          <g class="camp-stage camp-stage--cabin">
            <polygon class="camp-structure__shadow" points="515,622 960,622 1030,643 565,643"></polygon>
            <rect class="camp-structure__wall" x="545" y="350" width="390" height="272"></rect>
            <polygon class="camp-structure__roof" points="505,355 740,180 975,355"></polygon>
            <polygon class="camp-structure__gable" points="645,355 740,283 835,355"></polygon>
            <rect class="camp-structure__door" x="705" y="480" width="72" height="142"></rect>
            <rect class="camp-structure__window" x="590" y="445" width="58" height="58"></rect>
            <rect class="camp-structure__window" x="834" y="445" width="58" height="58"></rect>
            <rect class="camp-structure__porch" x="665" y="602" width="152" height="20"></rect>
            <line class="camp-structure__beam" x1="545" y1="410" x2="935" y2="410"></line>
            <line class="camp-structure__beam" x1="545" y1="470" x2="935" y2="470"></line>
          </g>
        </svg>
      </div>

      <div class="game-grid">
      <div class="game-info">
        <section class="camp-panel" aria-labelledby="camp-title">
          <div class="camp-panel__top">
            <div>
              <p class="camp-kicker">camp</p>
              <h2 id="camp-title">the clearing</h2>
              <p class="camp-description" id="camp-description">A quiet patch of ground with room to grow.</p>
            </div>
            <p class="camp-resource" aria-live="polite"><span class="camp-resource__count" id="wood-count">0</span> wood</p>
          </div>
          <div class="camp-build">
            <button class="camp-build__button" id="buildButton" type="button" disabled>
              <span id="build-label">build a lean-to</span>
              <span class="camp-build__cost" id="build-cost">10 wood</span>
            </button>
            <p class="camp-build__hint" id="build-hint">chop 10 wood to build</p>
          </div>
        </section>

        <dl class="stats" aria-live="polite">
          <dt>woodcutting</dt>
          <dd>
            <div class="statrow">
              <div class="progress" aria-hidden="true">
                <div class="progress-bar" id="bar-wood"></div>
              </div>
              <span class="level" id="text-wood">–</span>
            </div>
          </dd>

          <dt>mining</dt>
          <dd>
            <div class="statrow">
              <div class="progress" aria-hidden="true">
                <div class="progress-bar" id="bar-mine"></div>
              </div>
              <span class="level" id="text-mine">–</span>
            </div>
          </dd>

          <dt>fishing</dt>
          <dd>
            <div class="statrow">
              <div class="progress" aria-hidden="true">
                <div class="progress-bar" id="bar-fish"></div>
              </div>
              <span class="level" id="text-fish">–</span>
            </div>
          </dd>
        </dl>
      </div>

      <div>
        <section class="arena" id="arena" aria-label="play area"></section>
      </div>
      </div>
    </section>
  </main>

  <!-- Level-up toast (announced to SR via aria-live) -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Game logic -->
  <script src="/game/game.js" defer></script>

  <!-- Easter egg: this page is intentionally not in the nav, and intentionally
       does NOT load pages.js / nav.js / nav-layout.js. Visitors only reach
       /game/ if they know the URL. Do not "fix" this. -->
  <script src="/theme.js" defer></script>
  <script src="/favicon.js" defer></script>

</body>
</html>
